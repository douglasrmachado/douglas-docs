openapi: 3.0.3
info:
  title: Sample Project API
  version: '1.0'
  description: >
    Template OpenAPI spec for the Sample Project. Replace this file with the
    real specification for your project. The API reference pages under
    Projects > Sample Project are generated from this file.
servers:
  - url: https://api.example.com/v1
security:
  - bearerAuth: []
tags:
  - name: Resources
    description: Manage resources.
paths:
  /resources:
    get:
      operationId: listResources
      tags:
        - Resources
      summary: List resources
      description: Returns a paginated list of resources.
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, starting at 1. Defaults to 1.
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          required: false
          description: Items per page. Defaults to 20, max 100.
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: A page of resources.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resource'
                  page:
                    type: integer
                  total_pages:
                    type: integer
              example:
                data:
                  - id: res_123
                    name: Example resource
                page: 1
                total_pages: 4
    post:
      operationId: createResource
      tags:
        - Resources
      summary: Create a resource
      description: Creates a new resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: A human-readable name for the resource.
            example:
              name: Example resource
      responses:
        '201':
          description: The created resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
              example:
                id: res_124
                name: Example resource
  /resources/{id}:
    get:
      operationId: getResource
      tags:
        - Resources
      summary: Get a resource
      description: Returns a single resource by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The resource ID.
          schema:
            type: string
      responses:
        '200':
          description: The requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
              example:
                id: res_123
                name: Example resource
        '401':
          description: Missing or invalid bearer token.
        '404':
          description: No resource exists with that ID.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Resource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
